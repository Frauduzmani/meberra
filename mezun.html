<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Lise mezunları | Meberra</title>
  <meta name="description" content="Lise mezunları için şartlar artık Ülke şartları sayfasında: Durum = Lise mezunu. Giriş gerekmez.">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var t=localStorage.getItem("apmeberra:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <script>
    // Tur 11 (karar D2): Mezun Menüsü, Ülke şartları sayfasındaki "Lise mezunu" modeline taşındı.
    // Eski yer imleri kırılmasın: ?ulke=hu|pl (ve 15 ülkeden biri) korunarak yönlendirilir.
    (function () {
      var m = /[?&]ulke=([a-z]{2})(?:&|#|$)/i.exec(location.search);
      var u = m ? m[1].toLowerCase() : "";
      var ok = ["de", "it", "at", "ch", "nl", "be", "fr", "es", "se", "fi", "dk", "ie", "hu", "pl", "cz"].indexOf(u) >= 0;
      var hedef = "sartlar.html?model=lise-mezun" + (ok ? "&ulke=" + u + "&dil=en" : "") + (/^#m-[\w-]+$/.test(location.hash) ? location.hash : "");
      window.APMEBERRA_MEZUN_HEDEF = hedef;
      if (!window.APMEBERRA_YONLENDIRME_YOK) location.replace(hedef);
    })();
  </script>
</head>
<body class="page-sartlar page-mezun">
  <nav class="navbar">
    <a href="sartlar.html" class="nav-brand">
      <div class="brand-badge">Meberra</div>
      <div><div class="brand-title">Lise mezunları</div></div>
    </a>
    <div class="nav-actions"></div>
  </nav>
  <main class="main-container" id="main-content">
    <section class="sr-hazir surface u-mt-6" aria-labelledby="mz-tasindi">
      <h1 id="mz-tasindi">Lise mezunları sayfası taşındı</h1>
      <p>Şartlar artık tek sayfada: Ülke şartları sayfasında durum olarak “Lise mezunu”nu seç. 15 ülke, İngilizce ya da yerel dil seçeneği ve güncel duyurular orada.</p>
      <div class="btn-row u-jcenter"><a class="btn-primary" id="mz-git" href="sartlar.html?model=lise-mezun">Lise mezunu şartlarına git →</a></div>
    </section>
  </main>
  <script>document.getElementById("mz-git").setAttribute("href", window.APMEBERRA_MEZUN_HEDEF || "sartlar.html?model=lise-mezun");</script>
  <script src="assets/js/app.js"></script>
</body>
</html>
