<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5B3DF5">
  <link rel="apple-touch-icon" href="/assets/img/pwa/apple-touch-icon.png">
  <title>Sınavlar | Meberra</title>
  <meta name="description" content="AP, giriş, dil ve yüksek lisans sınavları: durumuna, hedef ülkene ve eğitim diline göre süz. Sıradaki tarih, ücret, format, süre, puanlama ve resmi kaynak.">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/icerik.css">
  <link rel="stylesheet" href="/assets/css/hedefim.css">
  <script src="/assets/js/adresler.js"></script>
  <script>try{var t=localStorage.getItem("apmeberra:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body class="page-sinavlar">

  <nav class="navbar">
    <a href="/bugun" class="nav-brand"><div class="brand-badge">Meberra</div></a>
    <div class="nav-actions"></div>
  </nav>

  <main class="main-container hd" id="main-content">
    <header class="page-head hd-head">
      <p class="hd-ust"><a href="/takvim" id="sv-takvim">Takvimim</a><span aria-hidden="true">·</span>Sınavlar</p>
      <h1>Sınavların</h1>
      <p class="hd-alt">Hedef ülkelerine göre girmen gereken sınavlar: sıradaki tarih, ücret ve resmi kaynak tek kartta.</p>
    </header>

    <div id="exam-root" class="sv-kok" aria-live="polite">
      <div class="empty-state"><div class="empty-ico" aria-hidden="true"><span class="spinner"></span></div><h2>Veri yükleniyor…</h2></div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom u-mt-0">
      <div>Tarih ve ücretleri kayıttan önce resmi kaynaktan teyit et. <span class="sv-sonraki">Sonraki adım: <a href="/basvurular">Başvurularım →</a></span></div>
      <div><a href="/takvim" class="sv-geri">← Takvimim</a></div>
    </div>
  </footer>

  <script src="/data/mevzuat/ulke-dizini.js"></script>
  <script src="/data/mevzuat/sinavlar.js"></script>
  <script src="/data/mevzuat/sinav-takvimi.js"></script>
  <script src="/data/mevzuat/ulke-rotalari.js"></script>
  <script src="/assets/js/rota.js"></script>
  <script src="/assets/js/sinav-motor.js"></script>
  <script src="/assets/js/ucretsiz-kural.js"></script>
  <script src="/assets/js/app.js"></script>
  <script>
  (function () {
    "use strict";
    var ME = window.APMEBERRA_ME, A = window.APMEBERRA, SM = window.APMEBERRA_SINAV_MOTOR;
    // K4: oturumsuz ziyaretçi genel görünümü görür (profil, liste ve rota yok); oturumluysa kişisel görünüm
    var GUEST = !ME;
    if (!GUEST && !ME.profile) return;
    var esc = apEsc, root = document.getElementById("exam-root");
    var DATA = Array.isArray(window.APMEBERRA_SINAVLAR) ? window.APMEBERRA_SINAVLAR.filter(function (s) { return s && s.id; }) : [];
    var TAKVIM = window.APMEBERRA_TAKVIM || null;
    var S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    var ICON = {
      ext: '<svg ' + S + '><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
      book: '<svg ' + S + '><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/></svg>',
      play: '<svg ' + S + '><path d="M7 4l13 8-13 8z"/></svg>',
      plus: '<svg ' + S + '><path d="M12 5v14M5 12h14"/></svg>',
      check: '<svg ' + S + '><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
      wait: '<svg ' + S + '><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      cal: '<svg ' + S + '><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
      arrow: '<svg ' + S + '><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
      filter: '<svg ' + S + '><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>',
      ap: '<svg ' + S + '><path d="M4 19l5-14h2l5 14M6.5 13h7"/><path d="M17 5h1.5a2.5 2.5 0 0 1 0 5H17V5zM17 10v9"/></svg>',
      giris: '<svg ' + S + '><path d="M9 4h6M9 4a2 2 0 0 0-2 2H5v15h14V6h-2a2 2 0 0 0-2-2"/><path d="M9 12h6M9 16h4"/></svg>',
      dil: '<svg ' + S + '><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c0 3-3 7-7 9"/><path d="M13 21l4-9 4 9M14.5 18h5"/></svg>'
    };

    if (!DATA.length || !SM) {
      root.innerHTML = '<div class="hd-bos"><span class="hd-tilo" data-tilo="dusunen" aria-hidden="true"></span><h2>Sınav listesi hazırlanıyor</h2>' +
        '<p>Her sınavın formatı ve tarihleri resmi kaynaklardan doğrulanıyor. Bu sırada AP ders sayfalarından çalışmaya devam edebilirsin.</p>' +
        '<div class="btn-row"><a class="btn-ghost" href="/ders/calculus">AP Calculus</a><a class="btn-ghost" href="/rehber/istanbul-sinav">İstanbul sınav rehberi</a></div></div>';
      tiloKoy();
      return;
    }

    // Kategori anahtarları sabit (tab-0..2, data-count); "Hepsi" (tab-h) varsayılan görünüm
    var KATS = [["AP", "AP"], ["Giriş Sınavı", "Giriş"], ["Dil Sınavı", "Dil"]];
    var KAT_I = { "AP": 0, "Giriş Sınavı": 1, "Dil Sınavı": 2 };
    var KAT_IKON = { "AP": ICON.ap, "Giriş Sınavı": ICON.giris, "Dil Sınavı": ICON.dil };
    var KAT_NE = { "AP": "AP ders sınavı", "Giriş Sınavı": "Giriş / yetenek sınavı", "Dil Sınavı": "Dil yeterlilik sınavı" };
    var KES = { "Doğrulandı": "ok", "Yoruma açık": "warn", "Yayımlanmadı": "info", "Teyit gerekir": "warn", "Doğrulanamadı": "bad" };
    var ULKE = A.ulkeAdlari || { de: "Almanya", it: "İtalya" };
    var MODEL_AD = { "lise": "Lise öğrencisi", "lise-mezun": "Lise mezunu", "uni-mezun": "Üniversite mezunu" };
    var DIZIN = window.APMEBERRA_ULKE_DIZINI && Array.isArray(window.APMEBERRA_ULKE_DIZINI.ulkeler) ? window.APMEBERRA_ULKE_DIZINI.ulkeler : [];
    var DK = {}; DIZIN.forEach(function (u) { DK[u.kod] = u; });
    var BY_ID = {}; DATA.forEach(function (s) { BY_ID[s.id] = s; });
    var PROF = GUEST ? null : ME.profile;
    var profUlke = PROF && Array.isArray(PROF.ulkeler) ? PROF.ulkeler.filter(function (u) { return ULKE[u]; }) : [];
    var profAp = PROF && Array.isArray(PROF.apDersleri) ? PROF.apDersleri.map(function (d) { return "ap-" + (d && d.ders); }) : [];
    var mine = GUEST ? [] : A.panel.get().sinavlarim;
    var LOCK = GUEST ? '<svg class="lock-ico" ' + S + '><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>' : "";
    var LOCK_TXT = GUEST ? '<span class="visually-hidden"> (giriş gerekir)</span>' : "";
    var RT = window.APMEBERRA_ROTA, rotaU = A.rota ? A.rota.aktif() : null, rotaVeri = rotaU ? A.rota.veri(rotaU) : null;

    // ---------------- Seçim durumu (URL > profil > varsayılan) ----------------
    var ilk = SM.secimCoz(location.search, PROF);
    var adresSecimli = /[?&](model|sinif|ulke|dil|filtre)=/.test(location.search);
    var st = { model: ilk.model, sinif: ilk.sinif, dil: ilk.dil, apAcik: false, zorla: null, kapsam: GUEST || adresSecimli ? "tumu" : "benim" };

    // ---------------- Tarih yardımcıları ----------------
    var AYLAR = ["ocak", "şubat", "mart", "nisan", "mayıs", "haziran", "temmuz", "ağustos", "eylül", "ekim", "kasım", "aralık"];
    var AY_KISA = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
    function bugun() {
      var o = window.APMEBERRA_BUGUN; // yalnızca test için
      var d = typeof o === "string" && /^\d{4}-\d{2}-\d{2}$/.test(o) ? isoGun(o) : new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    function isoGun(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || "")); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
    var BUGUN = bugun();
    function gunFark(d) { return Math.round((d - BUGUN) / 864e5); }
    function kisaTarih(d) { return d.getDate() + " " + AY_KISA[d.getMonth()] + " " + d.getFullYear(); }
    function gunYaz(iso) { var d = isoGun(iso); return d ? kisaTarih(d) : ""; }
    /**
     * Bir sınavın yaklaşan tarihleri (bugün ve sonrası). Kaynak sırası: AP için sinav-takvimi.js (yapılandırılmış),
     * diğerlerinde kayıttaki sonrakiTarih, o da yoksa resmi kaynaktan aktarılmış tarih metnindeki yıllı tarihler.
     * Metin yorumlanmaz: yalnızca "gün ay yıl" kalıbı okunur; etiketi tarihin hemen önündeki "kayıt / son gün" ifadesi belirler.
     */
    function olaylar(s) {
      var out = [];
      function ekle(d, etiket, ortak) { if (d && gunFark(d) >= 0) out.push({ d: d, etiket: etiket, ortak: ortak || null, id: s.id }); }
      if (s.kategori === "AP" && TAKVIM && TAKVIM.sinavlar) {
        var k = TAKVIM.sinavlar[String(s.id).replace(/^ap-/, "")];
        if (k && k.tarih) ekle(isoGun(k.tarih), "Sınav günü");
        if (TAKVIM.kayit) {
          ekle(isoGun(TAKVIM.kayit.sonGun), "Sipariş son günü", "ap-siparis");
          ekle(isoGun(TAKVIM.kayit.gecKayitSon), "Geç sipariş son günü", "ap-gec");
        }
      } else if (s.sonrakiTarih) {
        ekle(isoGun(s.sonrakiTarih), "Sıradaki oturum");
      } else if (s.kesinlik === "Doğrulandı") {
        // Yalnızca doğrulanmış kayıtlarda, metindeki oturum tarihleri: parantez içi notlar, "kayıt / son gün / ödeme / pencere"
        // ile başlayanlar, "…'da kapandı / geçti" diye bitenler ve kaynak okuma tarihleri sayılmaz. Yılı yazılmayan liste
        // öğesi aynı cümlede sonra gelen yılı alır ("6–7 Şubat, …, 27–28 Kasım 2027").
        var t = String(s.tarih || ""), re = /(\d{1,2})(?:\s*[–-]\s*\d{1,2})?\s+(Ocak|Şubat|Mart|Nisan|Mayıs|Haziran|Temmuz|Ağustos|Eylül|Ekim|Kasım|Aralık)(?:\s+(20\d\d))?(?![\dA-Za-zÇĞİÖŞÜçğıöşü])/g, m;
        while ((m = re.exec(t))) {
          var once = t.slice(0, m.index);
          if ((once.match(/\(/g) || []).length > (once.match(/\)/g) || []).length) continue;
          if (/kayıt|son gün|başvuru|ilgi bildirimi|ödeme|çekilme|erişim|okun|kontrol|güncel|itibaren|açılıyor|tarihli|pencere/.test(once.slice(-22).toLocaleLowerCase("tr-TR"))) continue;
          var son = m.index + m[0].length, sonra = t.slice(son, son + 14).toLocaleLowerCase("tr-TR");
          if (/^['’]/.test(sonra) || /kapandı|geçti/.test(sonra)) continue;
          var yil = m[3];
          if (!yil) { var cs = t.indexOf(". ", son), il = t.slice(son, cs < 0 ? t.length : cs).match(/\b(20\d\d)\b(?![\/–-])/); if (!il) continue; yil = il[1]; }
          ekle(new Date(+yil, AYLAR.indexOf(m[2].toLocaleLowerCase("tr-TR")), +m[1]), "Sıradaki oturum");
        }
      }
      return out.sort(function (a, b) { return a.d - b.d; });
    }
    var SIK = /neredeyse her gün|her an\b|sürekli randevu|haftanın 7 günü|sık ve son dakika|yıl boyunca oturum|tarih ve saati aday seçer/i;
    var OLAY = {}; DATA.forEach(function (s) { OLAY[s.id] = olaylar(s); });
    function geriCip(o, uzun, s) {
      if (!o) return s && SIK.test(String(s.tarih || "")) ? '<span class="hd-geri is-yok">' + ICON.cal + 'Sık oturum</span>' + (uzun ? '<small class="sv-olay-ad">Tarihi sen seçersin</small>' : "")
        : '<span class="hd-geri is-yok">' + ICON.cal + 'Tarih: ayrıntılarda</span>';
      var g = gunFark(o.d);
      return '<span class="hd-geri' + (g > 60 ? " is-uzak" : "") + '">' + ICON.cal + esc(kisaTarih(o.d)) + ' · ' + (g === 0 ? "bugün" : g + " gün") + '</span>' +
        (uzun ? '<small class="sv-olay-ad">' + esc(o.etiket) + '</small>' : "");
    }
    function ucretKisa(s) {
      if (s.kategori === "AP" && !s.ucret && TAKVIM && TAKVIM.kayit && TAKVIM.kayit.sinavUcretiUSD) return TAKVIM.kayit.sinavUcretiUSD + " $ · ABD dışı, sınav başına";
      var u = String(s.ucret || "").trim();
      if (!u) return "";
      var kes = u.search(/[;.](\s|$)/);
      var k = kes > 0 ? u.slice(0, kes) : u;
      return k.length > 46 ? k.slice(0, 44).replace(/[\s,:(]+\S*$/, "") + "…" : k + (kes > 0 && kes < u.length - 2 ? "…" : "");
    }

    function isUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u); }
    function safeLocal(h) { return typeof h === "string" && /^[A-Za-z0-9._-]+\.html(#[A-Za-z0-9._-]+)?$/.test(h); }
    function meta(label, v, wide) {
      if (v == null || v === "") v = "Doğrulanamadı";
      var s = String(v);
      return '<div' + (wide ? ' class="wide"' : "") + '><dt>' + label + '</dt><dd>' + (/doğrulanamadı/i.test(s) ? '<span class="unverified">' + esc(s) + '</span>' : esc(s)) + '</dd></div>';
    }
    function ulkePilleri(s, vurgu) {
      vurgu = vurgu || profUlke;
      var us = (s.ulkeler || []).slice().sort(function (a, b) { return (vurgu.indexOf(a) < 0) - (vurgu.indexOf(b) < 0); });
      return us.map(function (u) { return '<span class="pill' + (vurgu.indexOf(u) >= 0 ? " pill-accent" : "") + '">' + esc(ULKE[u] || u) + '</span>'; }).join("");
    }
    function kaynaklarHtml(s) {
      var l = (Array.isArray(s.kaynaklar) ? s.kaynaklar : []).filter(function (k) { return k && isUrl(k.url) && k.url !== s.kaynak; });
      if (!l.length) return "";
      return '<p class="sv-alt-bas">Diğer resmi kaynaklar</p><ul class="src-list sv-kaynaklar">' + l.map(function (k) {
        return '<li><a class="src-link" href="' + esc(k.url) + '" target="_blank" rel="noopener noreferrer">' + esc(k.ad || k.url) + ICON.ext + '<span class="visually-hidden"> (yeni sekmede açılır)</span></a>' +
          (k.belgeYili || k.erisim ? ' <span class="exam-kontrol">' + esc([k.belgeYili ? "belge " + k.belgeYili : "", k.erisim ? "erişim " + gunYaz(k.erisim) : ""].filter(Boolean).join(" · ")) + '</span>' : "") + '</li>';
      }).join("") + '</ul>';
    }
    function pinMetin(on) { return on ? "Takvimimde" : "Takvimime ekle"; }
    function card(s) {
      var pinned = mine.indexOf(s.id) >= 0;
      var duz = SM.duzeyleri(s), dilAd = SM.dilEtiketi(s);
      var o = OLAY[s.id][0], ucret = ucretKisa(s);
      var ne = [KAT_NE[s.kategori] || s.kategori, s.kurum, dilAd].filter(Boolean).join(" · ");
      var ders = safeLocal(s.dersSayfasi) ? '<a class="sv-link" href="' + esc(window.MEBERRA_ADRES ? MEBERRA_ADRES.temiz(s.dersSayfasi) : s.dersSayfasi) + '">' + ICON.book + 'Ders anlatımı (English)' + LOCK + LOCK_TXT + '</a>' : "";
      var den = s.denemeKodu ? '<a class="btn-ghost btn-sm sv-deneme-btn" href="/deneme?ders=' + encodeURIComponent(s.denemeKodu) + '">' + ICON.play + 'Deneme' + LOCK + LOCK_TXT + '</a>' : "";
      return '<article class="sv-kart exam-card" id="' + esc(s.id) + '" data-kategori="' + esc(s.kategori) + '" data-ulkeler="' + esc((s.ulkeler || []).join(" ")) + '" data-dil="' + esc(SM.sinavDilleri(s).join(" ")) + '" data-duzey="' + esc(duz.join(" ")) + '" aria-labelledby="h-' + esc(s.id) + '">' +
        '<div class="sv-kart-bas"><span class="sv-ikon" aria-hidden="true">' + (KAT_IKON[s.kategori] || ICON.giris) + '</span>' +
          '<div class="u-min0"><h3 id="h-' + esc(s.id) + '">' + esc(s.ad) + '</h3><p class="sv-ne">' + esc(ne) + '</p></div></div>' +
        '<div class="sv-rozetler"><span class="exam-rota" data-rota-rol hidden></span><span class="sv-benim-rozet" data-benim hidden>Senin için</span>' +
          (duz.length === 1 && duz[0] === "yl" ? '<span class="pill pill-yl">Yüksek lisans</span>' : "") +
          (KES[s.kesinlik] ? '<span class="kesinlik kesinlik-' + KES[s.kesinlik] + '" title="Bilginin kesinliği">' + esc(s.kesinlik) + '</span>' : "") + '</div>' +
        '<dl class="sv-veri">' +
          '<div><dt>Sıradaki</dt><dd>' + geriCip(o, true, s) + '</dd></div>' +
          '<div><dt>Ücret</dt><dd class="sv-ucret">' + (ucret ? esc(ucret) : '<span class="sv-soluk">Resmi kaynakta</span>') + '</dd></div>' +
        '</dl>' +
        '<div class="sv-eylem">' +
          (GUEST ? '<a class="btn-ghost btn-sm" href="/giris?donus=' + encodeURIComponent("/sinavlar#" + s.id) + '">' + LOCK + 'Takvimime ekle' + LOCK_TXT + '</a>'
                 : '<button type="button" class="pin-btn sv-ekle" data-pin="' + esc(s.id) + '" aria-pressed="' + pinned + '">' + (pinned ? ICON.check : ICON.plus) + '<span>' + pinMetin(pinned) + '</span></button>') +
          den + '</div>' +
        '<details class="hd-acilir sv-detay"><summary>Ayrıntılar</summary><div class="sv-detay-ic">' +
          '<dl class="exam-meta">' + (!s.format && !s.sure && !s.puanlama && !s.tarih ? meta("Format, süre, puanlama, tarih", "Bu kayıtta yok; Doğrulanamadı. Resmi kaynaktan kontrol et.", true)
            : meta("Tarih", s.tarih, true) + meta("Format", s.format, true) + meta("Süre", s.sure) + meta("Puanlama", s.puanlama)) +
            (s.ucret ? meta("Ücret", s.ucret, true) : "") + '</dl>' +
          (s.not ? '<p class="exam-note">' + esc(s.not) + '</p>' : "") +
          '<p class="sv-alt-bas">Geçerli olduğu ülkeler</p><div class="pill-row pill-ulkeler">' + ulkePilleri(s) + '</div>' +
          (ders ? '<p class="sv-ders">' + ders + '</p>' : (s.kategori !== "AP" && !s.denemeKodu ? '<p class="exam-noprep">Portalda bu sınav için ders anlatımı ve deneme yok; hazırlık için resmi kaynağa bak.</p>' : "")) +
          kaynaklarHtml(s) +
          '<p class="sv-kaynak-satir">' + (s.sonKontrol ? '<span class="exam-kontrol">Son kontrol: ' + esc(gunYaz(s.sonKontrol)) + '</span>' : "") +
            (isUrl(s.kaynak) ? '<a class="src-link" href="' + esc(s.kaynak) + '" target="_blank" rel="noopener noreferrer">Resmi kaynak' + ICON.ext + '<span class="visually-hidden"> (yeni sekmede açılır)</span></a>' : '<span class="unverified">Kaynak: Doğrulanamadı</span>') + '</p>' +
        '</div></details>' +
      '</article>';
    }
    function seg(ad, deger, metin, idEk) {
      return '<label class="sr-opt"><input type="radio" name="' + ad + '" value="' + deger + '"' + (idEk ? ' id="' + idEk + '"' : "") + '><span' + (idEk ? ' id="' + idEk + '-ad"' : "") + '>' + metin + '</span></label>';
    }
    var ulkeOpts = Object.keys(ULKE).map(function (u) { return [u, ULKE[u]]; }).sort(function (a, b) { return a[1].localeCompare(b[1], "tr"); })
      .map(function (x) { return '<option value="' + x[0] + '">' + esc(x[1]) + '</option>'; }).join("");

    // Kartlar sıradaki tarihe göre dizilir (tarihi olmayanlar sonda; aynı gün kategori sırası)
    var SIRALI = DATA.slice().sort(function (a, b) {
      var x = OLAY[a.id][0], y = OLAY[b.id][0];
      if (x && y && x.d - y.d) return x.d - y.d;
      if (!!x !== !!y) return x ? -1 : 1;
      return (KAT_I[a.kategori] || 0) - (KAT_I[b.kategori] || 0);
    });

    root.innerHTML =
      '<section class="sv-serit hd-kart hd-gir" id="sv-serit" aria-labelledby="sv-serit-h"></section>' +
      '<div class="sv-arac">' +
        '<div class="hd-cipler sv-kapsam" role="group" aria-label="Hangi sınavlar">' +

    }
    [tabH].concat(tabs).forEach(function (t) {
      t.addEventListener("click", function () { selectTab(t.dataset.kat); });
      t.addEventListener("keydown", function (e) {
        var vt = siraliSekmeler(), j = vt.indexOf(t);
        var n = e.key === "ArrowRight" ? (j + 1) % vt.length : e.key === "ArrowLeft" ? (j - 1 + vt.length) % vt.length : e.key === "Home" ? 0 : e.key === "End" ? vt.length - 1 : -1;
        if (n >= 0) { e.preventDefault(); selectTab(vt[n].dataset.kat, true); }
      });
    });
    function kapsamYap(k) { st.kapsam = k; st.zorla = null; apply(); urlYaz(); }
    root.querySelectorAll("[data-kapsam]").forEach(function (b) { b.addEventListener("click", function () { kapsamYap(b.dataset.kapsam); }); });
    function degisti() { st.zorla = null; st.kapsam = "tumu"; apply(); urlYaz(); }
    sel.addEventListener("change", degisti);
    form.addEventListener("change", function (e) {
      var t = e.target; if (!t || t.type !== "radio") return;
      if (t.name === "model") { st.model = t.value; if (st.model !== "lise") st.sinif = null; else if (!st.sinif && PROF && /^(9|10|11|12)$/.test(String(PROF.sinif))) st.sinif = String(PROF.sinif); }
      else if (t.name === "sinif") st.sinif = t.value;
      else if (t.name === "dil") st.dil = t.value;
      degisti();
    });
    form.addEventListener("submit", function (e) { e.preventDefault(); });
    document.getElementById("sn-temizle").addEventListener("click", function () {
      var p = SM.secimCoz("", PROF);
      st.model = p.model; st.sinif = p.sinif; st.dil = p.dil; st.apAcik = false;
      sel.value = sel.querySelector('option[value="profil"]') ? "profil" : "hepsi";
      if (GUEST) degisti(); else kapsamYap("benim");
      var oz = document.getElementById("sn-ozet"); oz.setAttribute("tabindex", "-1"); oz.focus();
    });
    document.getElementById("sn-ap-ac").addEventListener("click", function () {
      st.apAcik = !st.apAcik; apply();
      if (st.apAcik) selectTab("AP", true);
    });
    root.addEventListener("click", function (e) {
      var g = e.target.closest("[data-git]");
      if (g) { e.preventDefault(); kartaGit(g.dataset.git); return; }
      var b = e.target.closest("[data-sn]"); if (!b) return;
      if (b.dataset.sn === "tumu") { kapsamYap("tumu"); return; }
      if (b.dataset.sn === "dil-en") st.dil = "en";
      else if (b.dataset.sn === "dil-hepsi") st.dil = "hepsi";
      else if (b.dataset.sn === "hepsi") sel.value = "hepsi";
      degisti();
    });

    // Rota bağlamı: aktif rotaya göre "Bu rotada zorunlu" / "Seçmeli" rozetleri ve "Takvimimdeki sınavlar" süzgeci
    function rotaGuncelle() {
      rotaU = A.rota.aktif(); rotaVeri = rotaU ? A.rota.veri(rotaU) : null;
      var ad = ULKE[rotaU] || "";
      cards.forEach(function (el) {
        var pr = !GUEST && ME && ME.profile ? ME.profile : null;
        var rol = rotaVeri && RT ? RT.sinavRolu(rotaVeri, el.id, pr) : null;
        var alt = rol && RT ? RT.alternatifler(rotaVeri, el.id, pr).map(function (x) { return BY_ID[x] ? BY_ID[x].ad : x; }) : [];
        el.dataset.rol = rol || "";
        var b = el.querySelector("[data-rota-rol]");
        b.className = "exam-rota" + (rol ? " rota-badge rota-badge-" + rol : "");
        b.textContent = rol === "zorunlu" ? (alt.length ? ad + " rotasında zorunlu (biri yeterli)" : ad + " rotasında zorunlu") : rol === "secmeli" ? ad + " rotasında seçmeli" : "";
        b.title = alt.length ? "Şunlardan biri de olur: " + alt.join(", ") : "";
        b.hidden = !rol;
      });
      var o = document.getElementById("opt-rota");
      if (o) o.textContent = "Takvimimdeki sınavlar (" + ad + ")";
      var n = cards.filter(function (el) { return el.dataset.rol; }).length;
      document.getElementById("rota-ctx").innerHTML = rotaU
        ? (rotaVeri ? '<strong>' + esc(ad) + ' rotası</strong>: ' + n + ' sınav bu rotada zorunlu ya da seçmeli. Tarihli adımlar <a href="/takvim?ulke=' + rotaU + '">Takvimim</a>’de.'
                    : (rotaU === 'de' || rotaU === 'it') ? '<strong>' + esc(ad) + ' rotası</strong>: rota kuralları hazırlanıyor; şimdilik bu ülkenin sınavları gösteriliyor.'
                    : '<strong>' + esc(ad) + '</strong>: tarihli rota Almanya ve İtalya lisans için hazır; bu ülkenin şartları <a href="/ulkem?model=' + esc((ME.profile && ME.profile.ogrenciModeli) || "lise") + '&amp;ulke=' + rotaU + '&amp;dil=' + (ME.profile && ME.profile.egitimDili === "yerel" ? "yerel" : "en") + '">Ülkem</a>’de.')
        : "";
      apply();
    }
    if (rotaU) A.rota.anahtar(document.getElementById("rota-switch"), rotaGuncelle);
    cards.forEach(function (el) { el.dataset.rol = ""; });
    if (GUEST) {
      var sn = document.querySelector(".footer .sv-sonraki"); if (sn) sn.remove();
      var tk = document.getElementById("sv-takvim"); if (tk) { var sp = tk.nextElementSibling; tk.remove(); if (sp) sp.remove(); }
      var back = document.querySelector('.footer a.sv-geri');
      if (back) { back.setAttribute("data-geri", ""); back.setAttribute("href", "/ulkem" + A.erisim.secimSorgusu()); back.textContent = "← Ülke şartlarına dön"; }
    }

    // "Takvimime ekle": kişisel sınav listesi (apmeberra:panel:v1 → sinavlarim; Bugün ve Takvimim bu listeyi okur)
    root.addEventListener("click", function (e) {
      var b = e.target.closest(".pin-btn"); if (!b || GUEST) return;
      var id = b.dataset.pin;
      var o = A.panel.update(function (p) {
        var i = p.sinavlarim.indexOf(id);
        if (i >= 0) p.sinavlarim.splice(i, 1); else p.sinavlarim.push(id);
      });
      mine = o.sinavlarim;
      var on = mine.indexOf(id) >= 0;
      b.setAttribute("aria-pressed", String(on));
      b.innerHTML = (on ? ICON.check : ICON.plus) + '<span>' + pinMetin(on) + '</span>';
      if (on) { b.classList.remove("h-zipla"); void b.offsetWidth; b.classList.add("h-zipla"); }
      apply();
    });

    function kartaGit(id) {
      var el = document.getElementById(id);
      if (!el || !el.classList.contains("exam-card")) return false;
      if (el.hidden) {
        if (!gorunur(el)) { st.kapsam = "tumu"; if (!suzgecGorunur(el)) { sel.value = "hepsi"; st.dil = "hepsi"; } }
        if (el.dataset.kategori === "AP" && SM.apGizli(st.model)) st.apAcik = true;
        if (!gorunur(el)) st.zorla = el.id;
        kat = "hepsi"; apply();
      }
      el.scrollIntoView({ block: "start", behavior: azHareket() ? "auto" : "smooth" });
      el.classList.add("is-flash"); setTimeout(function () { el.classList.remove("is-flash"); }, 2200);
      el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true });
      return true;
    }
    // #sinav-id ile gelindiyse: süzgeci gerekirse genişlet, karta odaklan, ayrıntıyı aç
    function openHash() {
      var id = decodeURIComponent((location.hash || "").slice(1));
      var el = id && document.getElementById(id);
      if (!el || !el.classList.contains("exam-card")) return false;
      if (!gorunur(el)) { st.kapsam = "tumu"; }
      if (el.dataset.kategori === "AP" && SM.apGizli(st.model)) st.apAcik = true;
      if (!gorunur(el)) { sel.value = "hepsi"; st.dil = "hepsi"; }
      if (!gorunur(el)) st.zorla = el.id;
      kat = "hepsi"; apply();
      var d = el.querySelector(".sv-detay"); if (d) d.open = true;
      el.scrollIntoView({ block: "start" });
      el.classList.add("is-flash"); setTimeout(function () { el.classList.remove("is-flash"); }, 2200);
      el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true });
      return true;
    }
    if (rotaU) rotaGuncelle();
    if (!openHash()) {
      apply();
      // Profilde hiç eşleşme yoksa liste boş açılmasın
      if (st.kapsam === "benim" && !cards.some(function (el) { return !el.hidden; })) { st.kapsam = "tumu"; apply(); }
      if (st.kapsam === "tumu" && !GUEST && sel.value === "profil" && !cards.some(suzgecGorunur)) { sel.value = "hepsi"; apply(); }
    }
    if (location.search) urlYaz();
    window.addEventListener("hashchange", openHash);
  })();
  </script>
</body>
</html>
