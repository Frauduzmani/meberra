# =====================================================================
# Meberra — nginx sanal sunucu yapılandırması
# Kurulum:
#   sudo cp deploy/nginx-meberra.conf /etc/nginx/sites-available/meberra
#   sudo ln -s /etc/nginx/sites-available/meberra /etc/nginx/sites-enabled/meberra
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL sertifikası (Let's Encrypt) bu dosyayı kopyalamadan ÖNCE alınmalıdır,
# çünkü aşağıdaki 443 bloğu sertifika dosyalarını arar:
#   sudo certbot certonly --nginx -d meberra.com -d www.meberra.com
# (Alternatif: webroot yöntemi — aşağıdaki /.well-known/acme-challenge/ konumu
#  bunun için hazırdır:  sudo certbot certonly --webroot -w /var/www/certbot ...)
# Yenileme otomatiktir (certbot.timer). Test: sudo certbot renew --dry-run
# =====================================================================

# Uygulama (Node.js) — Docker veya systemd, her ikisi de 127.0.0.1:3000
upstream meberra_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# --- HTTP (80): sertifika doğrulaması + HTTPS'e yönlendirme ------------
server {
    listen 80;
    listen [::]:80;
    server_name meberra.com www.meberra.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://meberra.com$request_uri;
    }
}

# --- HTTPS www -> çıplak alan adı ---------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.meberra.com;

    ssl_certificate     /etc/letsencrypt/live/meberra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meberra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://meberra.com$request_uri;
}

# --- HTTPS ana site -------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meberra.com;

    ssl_certificate     /etc/letsencrypt/live/meberra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meberra.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MeberraSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Yükleme sınırı (dekont vb.)
    client_max_body_size 10m;

    # Sıkıştırma (HTML her zaman gzip'lenir; diğer metin türleri:)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # --- Güvenlik başlıkları ---
    # Not: Alt "location" bloklarında add_header KULLANMAYIN; kullanırsanız
    # bu başlıklar o konumda kaybolur (nginx kalıtım kuralı). Önbellek için
    # "expires" yönergesi kullanılır, o başlıkları bozmaz.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # İçerik Güvenlik Politikası (CSP) — VARSAYILAN OLARAK KAPALI.
    # Sayfalar satır içi <script> blokları kullanır ve MathJax'i
    # cdn.jsdelivr.net'ten yükler; bu yüzden 'unsafe-inline' ve jsdelivr şarttır.
    # Uygulama (Node) zaten bir CSP başlığı gönderiyorsa BURAYI AÇMAYIN:
    # iki CSP başlığı birlikte uygulanır ve en kısıtlayıcısı kazanır, site bozulabilir.
    # Açmadan önce "Content-Security-Policy-Report-Only" ile deneyin.
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Ortak vekil ayarları
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    # Yazı tipleri nadiren değişir: uzun önbellek
    location /assets/fonts/ {
        proxy_pass http://meberra_app;
        expires 30d;
    }

    # Görseller (ikon, maskot, PWA): 1 gün. CSS/JS için nginx önbellek başlığı EKLENMEZ: uygulama her açılışta
    # ETag ile doğrulatır (sürüm geçişinde eski stil/betik kalmaz). Burada expires yazmak bu kuralı ezer.
    location /assets/img/ {
        proxy_pass http://meberra_app;
        expires 1d;
    }
    location /assets/ {
        proxy_pass http://meberra_app;
    }

    # API: asla önbelleğe alınmaz (uygulama kendi başlıklarını belirler)
    location /api/ {
        proxy_pass http://meberra_app;
    }

    location / {
        proxy_pass http://meberra_app;
    }
}
