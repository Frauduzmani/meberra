# Meberra CI: sunucu testleri, birim testleri, içerik denetimi ve tarayıcı uçtan uca testleri.
# Gizli anahtar gerekmez: e2e sunucusu geçici veri klasörüyle ve rastgele yönetici kimliğiyle başlar (e2e/kurulum.js).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 4 * * 1" # her pazartesi 04:00 UTC (İstanbul 07:00)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      TZ: Europe/Istanbul
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Sunucu testleri (npm test)
        run: npm test

      - name: Birim testleri (araclar/testler/*-birim-test.js)
        run: |
          set -e
          kalan=0
          for f in araclar/testler/*-birim-test.js; do
            echo "::group::$f"
            if node "$f"; then echo "✔ $f"; else echo "::error file=$f::birim testi kaldı"; kalan=1; fi
            echo "::endgroup::"
          done
          exit $kalan

      - name: İçerik denetimi (pm-denetim)
        run: node araclar/pm-denetim.js

      - name: Playwright tarayıcısı (Chromium + sistem bağımlılıkları)
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler (npm run test:e2e)
        run: npm run test:e2e

      - name: Playwright raporu (yalnızca hata olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
